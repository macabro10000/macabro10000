<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZERO - Real-Time Strategy MMO</title>
  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Pantalla de Login -->
  <div id="login-screen">
    <div class="login-box">
      <h1 style="color: #66fcf1; margin-bottom: 5px;">⚡ ZERO</h1>
      <p style="color: #a5a5a5; margin-bottom: 25px; font-size: 13px;">Estrategia Masiva en Tiempo Real</p>
      <input type="text" id="username-input" placeholder="Tu Nombre de Lord" maxlength="15">
      <button onclick="login()">Iniciar Conquista</button>
    </div>
  </div>

  <!-- Botón flotante para abrir/cerrar el menú en móviles -->
  <button id="toggleMenuBtn" onclick="toggleSidebar()">📂 Menú</button>

  <!-- Contenedor del Juego -->
  <div id="game-container" style="display: none;">
    <div id="sidebar" class="sidebar">
      <h2 style="color: #66fcf1; font-size: 18px;">🛡️ Panel de Control</h2>
      
      <div class="stat-box">
        <h3>📊 Imperio</h3>
        <div class="stat-row"><span>Lord:</span><span id="player-name">-</span></div>
        <div class="stat-row"><span>Tropas:</span><span id="player-troops">-</span></div>
        <div class="stat-row"><span>Oro:</span><span id="player-gold">-</span></div>
        <div class="stat-row"><span>Territorios:</span><span id="player-territories">-</span></div>
        <div class="stat-row"><span>Nivel:</span><span id="player-level">-</span></div>
        <div class="stat-row"><span>Ingreso/s:</span><span id="player-income">-</span></div>
      </div>

      <button onclick="recruitTroops()">⚔️ Reclutar 10 Tropas (100🪙)</button>
      <button onclick="showLeaderboard()" style="background: #c3073f; color: #fff;">🏆 Leaderboard</button>

      <div id="selected-territory">
        <h3 style="color: #c3073f; margin-bottom: 8px;">📍 Territorio Seleccionado</h3>
        <div class="stat-row"><span>ID:</span><span id="sel-id">-</span></div>
        <div class="stat-row"><span>Coordenadas:</span><span id="sel-pos">-</span></div>
        <div class="stat-row"><span>Propietario:</span><span id="sel-owner">-</span></div>
        <div class="stat-row"><span>Guarnición:</span><span id="sel-troops">-</span></div>
        <button id="btn-attack" onclick="attackSelected()" style="margin-top: 10px; background: #c3073f; color: #fff;">⚔️ Atacar Territorio</button>
        <button onclick="buildBarracks()" style="margin-top: 5px;">🏗️ Cuartel (200🪙)</button>
        <button onclick="buildMine()" style="margin-top: 5px;">⛏️ Mina (150🪙)</button>
        <button onclick="buildWall()" style="margin-top: 5px;">🧱 Muro (300🪙)</button>
      </div>
    </div>

    <!-- Mapa -->
    <div id="map-container">
      <div id="map"></div>
    </div>
  </div>

  <!-- Notificaciones -->
  <div id="notifications"></div>

  <script src="js/game.js"></script>
</body>
</html>
