<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#08120d">

  <title>Forja Imperial</title>

  <link rel="stylesheet" href="/css/style.css">
</head>

<body>

  <div id="game">

    <!-- =========================================
         CABECERA
    ========================================== -->

    <header class="topbar">

      <div class="logo">
        <span class="logo-icon">⚔</span>
        <div>
          <strong>FORJA IMPERIAL</strong>
          <small>Conquista el mundo</small>
        </div>
      </div>

      <div class="resources">

        <div class="resource gold-resource">
          <span>🪙</span>
          <div>
            <small>ORO</small>
            <strong id="gold">500</strong>
          </div>
        </div>

        <div class="resource troops-resource">
          <span>⚔️</span>
          <div>
            <small>TROPAS</small>
            <strong id="troops">100</strong>
          </div>
        </div>

        <div class="resource level-resource">
          <span>👑</span>
          <div>
            <small>NIVEL</small>
            <strong id="cityLevel">1</strong>
          </div>
        </div>

      </div>

    </header>


    <!-- =========================================
         MAPA
    ========================================== -->

    <main class="map-container">

      <canvas id="map"></canvas>

      <div class="map-overlay">

        <div class="map-status">
          <span class="online-dot"></span>
          <span>Servidor conectado</span>
        </div>

        <div class="map-controls">

          <button id="zoomIn" type="button">
            +
          </button>

          <button id="zoomOut" type="button">
            −
          </button>

          <button id="centerMap" type="button">
            ◎
          </button>

        </div>

      </div>

    </main>


    <!-- =========================================
         PANEL DE CIUDAD
    ========================================== -->

    <aside id="cityPanel" class="city-panel hidden">

      <button
        id="closeCityPanel"
        class="close-button"
        type="button"
      >
        ×
      </button>

      <div class="city-header">

        <div class="city-icon">
          🏰
        </div>

        <div>
          <h2 id="selectedCityName">
            Ciudad
          </h2>

          <span id="selectedCityLevel">
            Nivel 1
          </span>
        </div>

      </div>

      <div class="city-stats">

        <div>
          <small>TROPAS</small>
          <strong id="selectedCityTroops">
            0
          </strong>
        </div>

        <div>
          <small>PROPIETARIO</small>
          <strong id="selectedCityOwner">
            Neutral
          </strong>
        </div>

      </div>

      <button
        id="attackButton"
        class="attack-button"
        type="button"
      >
        ⚔ ATACAR
      </button>

    </aside>


    <!-- =========================================
         BARRA INFERIOR
    ========================================== -->

    <nav class="bottom-menu">

      <button type="button" class="menu-button active">
        <span>🗺️</span>
        <small>Mapa</small>
      </button>

      <button type="button" class="menu-button">
        <span>🏰</span>
        <small>Ciudad</small>
      </button>

      <button type="button" class="menu-button">
        <span>⚔️</span>
        <small>Ejército</small>
      </button>

      <button type="button" class="menu-button">
        <span>👑</span>
        <small>Imperio</small>
      </button>

      <button type="button" class="menu-button">
        <span>☰</span>
        <small>Menú</small>
      </button>

    </nav>

  </div>


  <!-- =========================================
       SOCKET.IO
       IMPORTANTE PARA EL TIEMPO REAL
  ========================================== -->

  <script src="/socket.io/socket.io.js"></script>

  <!-- =========================================
       LÓGICA DEL JUEGO
  ========================================== -->

  <script src="/js/game.js"></script>

</body>
</html>
